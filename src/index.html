<!doctype html>
<html lang="en">

<head>
    <title>Wowkeyb - World of Warcraft Keybinding Website</title>
    <meta charset="utf-8" />
    <meta name="description"
        content="Create, manage, and optimize your World of Warcraft keybindings and macros with WowKeyb - the ultimate WoW keybinding manager for all classes and specializations" />
    <meta name="keywords"
        content="World of Warcraft, WoW, keybindings, macros, keybind manager, WoW keybindings, WoW macros, class builds, keyboard layout" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0" />

    <base href="/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/logo/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />

    <!-- Fonts -->
    <link href="fonts/inter/inter.css" rel="stylesheet" />
    <link href="https://fonts.gstatic.com" rel="preconnect" />

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet" />

    <!-- Icon fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- Splash screen styles -->
    <link href="styles/splash-screen.css" rel="stylesheet" />
</head>

<body>
    <!-- Splash screen -->
    <fuse-splash-screen>
        <img src="images/logo/logo.svg" alt="WoWKeyb logo" />
        <div class="spinner">
            <div class="bounce1"></div>
            <div class="bounce2"></div>
            <div class="bounce3"></div>
        </div>
    </fuse-splash-screen>

    <!-- App root -->
    <app-root></app-root>
</body>

</html>
