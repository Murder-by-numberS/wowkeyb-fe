<div class="create-macro-container">
    <div class="create-macro-header">
        <h1>Create New Macro</h1>
    </div>

    <div class="create-macro-form">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Macro Name</mat-label>
            <input matInput [(ngModel)]="macroName" placeholder="Enter macro name" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Description (Optional)</mat-label>
            <textarea matInput [(ngModel)]="macroDescription" placeholder="Enter macro description" rows="3"></textarea>
        </mat-form-field>

        <!-- Icon Picker -->
        <div class="form-group">
            <label class="form-label">Macro Icon</label>
            <app-icon-picker [selectedIcon]="selectedIcon" (iconSelected)="onIconSelected($event)"
                (iconCleared)="onIconCleared()" placeholder="Select an icon for your macro">
            </app-icon-picker>
        </div>

        <!-- Class, Spec, and Hero Talent Selection -->
        <div class="selection-row">
            <!-- Class Selection -->
            <mat-form-field appearance="outline" class="selection-field">
                <mat-label>Class</mat-label>
                <mat-select [(ngModel)]="selectedClass" (selectionChange)="onClassChange()" required>
                    <mat-option value="">Select Class</mat-option>
                    <mat-option *ngFor="let class of classes" [value]="class.value">
                        {{ class.label }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <!-- Spec Selection -->
            <mat-form-field appearance="outline" class="selection-field">
                <mat-label>Specialization (Optional)</mat-label>
                <mat-select [(ngModel)]="selectedSpec" (selectionChange)="onSpecChange()" [disabled]="!selectedClass">
                    <mat-option value="">Select Spec</mat-option>
                    <mat-option *ngFor="let spec of specs" [value]="spec">
                        {{ spec }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <!-- Hero Talent Selection -->
            <mat-form-field appearance="outline" class="selection-field">
                <mat-label>Hero Talent (Optional)</mat-label>
                <mat-select [(ngModel)]="selectedHeroTalent" [disabled]="!selectedSpec">
                    <mat-option value="">Select Hero Talent</mat-option>
                    <mat-option *ngFor="let heroTalent of heroTalents" [value]="heroTalent">
                        {{ heroTalent }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>


        <!-- Macro Text -->
        <mat-form-field appearance="outline" class="w-full macro-text-field">
            <mat-label>Macro Text</mat-label>
            <textarea matInput [(ngModel)]="macroText" placeholder="Enter macro commands" rows="8" required></textarea>
        </mat-form-field>

        <!-- Action Buttons -->
        <div class="form-actions">
            <button mat-button (click)="cancel()" class="cancel-button">
                Cancel
            </button>
            <button mat-raised-button color="primary" (click)="saveMacro()"
                [disabled]="!macroName || !macroText || !selectedClass" class="save-button">
                Create Macro
            </button>
        </div>
    </div>
</div>
