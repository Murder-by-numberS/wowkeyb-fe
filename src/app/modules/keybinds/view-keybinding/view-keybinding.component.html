<div class="flex flex-col w-full h-full">
    <div class="flex items-center justify-between p-4 bg-gray-100">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold">{{ keybinding?.name }}</h1>
            @if (isAuthenticated) {
            @if (isOwner) {
            <button mat-stroked-button (click)="onEditKeybinding()">
                <mat-icon>edit</mat-icon>
                <span class="ml-2">Edit</span>
            </button>
            } @else {
            <button mat-stroked-button (click)="onDuplicateKeybinding()">
                <mat-icon>content_copy</mat-icon>
                <span class="ml-2">Duplicate</span>
            </button>
            }
            }
        </div>
        <div class="flex items-center gap-4">
            <button mat-stroked-button (click)="onExpand()" *ngIf="!isExpanded">
                <mat-icon>expand</mat-icon>
                <span class="ml-2">Expand View</span>
            </button>
            <button mat-stroked-button (click)="onCollapse()" *ngIf="isExpanded">
                <mat-icon>compress</mat-icon>
                <span class="ml-2">Collapse</span>
            </button>
        </div>
    </div>

    <div class="flex flex-row p-4 bg-gray-100 border-t border-gray-200">
        <div class="flex items-center gap-4">
            @if (keybinding?.class) {
            <div class="flex items-center gap-2">
                <span class="text-gray-600">Class:</span>
                <span class="font-medium">{{ keybinding.class }}</span>
            </div>
            }
            @if (keybinding?.spec) {
            <div class="flex items-center gap-2">
                <span class="text-gray-600">Spec:</span>
                <span class="font-medium">{{ keybinding.spec }}</span>
            </div>
            }
            @if (keybinding?.heroTalent) {
            <div class="flex items-center gap-2">
                <span class="text-gray-600">Hero Talent:</span>
                <span class="font-medium">{{ keybinding.heroTalent }}</span>
            </div>
            }
        </div>
    </div>

    <div class="flex-1 overflow-hidden min-h-[500px] relative">
        @if (isExpanded) {
        <app-expanded-keyboard [keybinding]="keybinding" (collapse)="onCollapse()" #expandedKeyboard
            class="absolute inset-0">
        </app-expanded-keyboard>
        } @else {
        <app-view-keyboard [keybinding]="keybinding" (keyClick)="onKeyClick($event.key, $event.keybinds)"
            class="absolute inset-0">
        </app-view-keyboard>
        }
    </div>
</div>
