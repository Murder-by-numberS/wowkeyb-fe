<div class="flex w-full flex-auto flex-col">

    <mat-drawer-container class="h-full">

        <!-- Mobile: Over mode, Desktop: Side mode -->
        <mat-drawer #drawer class="h-full w-64 sm:w-64" [mode]="isMobile ? 'over' : 'side'" [(opened)]="opened">
            <keybinds-drawer (keybindingSelected)="onKeybindingSelected($event)"></keybinds-drawer>
        </mat-drawer>
        <mat-drawer-content class="flex flex-col">
            @if (isHomeRoute) {
            <keybinds-home [isAuthenticated]="isAuthenticated"></keybinds-home>
            } @else if (isMyKeybindingsRoute) {
            <view-all-keybindings [keybindingSelected]="keybindingSelected" [selectedKeybinding]="selectedKeybinding"
                [selectedKeybindingName]="selectedKeybindingName" [isAuthenticated]="isAuthenticated"
                [editingName]="editingName" [nameForm]="nameForm" [opened]="opened"
                [currentKeybindingCount]="keybindings.length" [maxKeybindings]="MAX_SIZE"
                (deleteKeybinding)="deleteKeybinding($event)" (shareKeybinding)="shareKeybinding()"
                (editName)="editName()" (saveName)="saveName()" (cancelName)="cancelName()"
                (togglePublic)="togglePublic()" (refreshChildKeybindings)="refreshChildKeybindings()"
                (updateKeybinding)="updateKeybinding($event)" (toggleDrawer)="opened = !opened"
                (selectKeybinding)="onKeybindingSelected($event)"
                (refreshAbilities)="refreshAbilitiesForMigratedKeybinding($event)">
            </view-all-keybindings>
            }
        </mat-drawer-content>
    </mat-drawer-container>


</div>
