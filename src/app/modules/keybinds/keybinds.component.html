<div class="flex w-full flex-auto flex-col">

    <mat-drawer-container class="h-full">

        <mat-drawer #drawer class="h-full w-64" mode="side" [(opened)]="opened">
            <keybinds-drawer (keybindingSelected)="onKeybindingSelected($event)"></keybinds-drawer>
        </mat-drawer>
        <mat-drawer-content class="">
            @if (isHomeRoute) {
            <keybinds-home [isAuthenticated]="isAuthenticated"></keybinds-home>
            } @else if (isMyKeybindingsRoute) {
            <view-all-keybindings [keybindingSelected]="keybindingSelected" [selectedKeybinding]="selectedKeybinding"
                [selectedKeybindingName]="selectedKeybindingName" [isAuthenticated]="isAuthenticated"
                [editingName]="editingName" [nameForm]="nameForm" [opened]="opened"
                (deleteKeybinding)="deleteKeybinding()" (shareKeybinding)="shareKeybinding()" (editName)="editName()"
                (saveName)="saveName()" (cancelName)="cancelName()" (togglePublic)="togglePublic()"
                (refreshChildKeybindings)="refreshChildKeybindings()" (updateKeybinding)="updateKeybinding($event)"
                (toggleDrawer)="opened = !opened">
            </view-all-keybindings>
            } @else if (isViewKeybindingRoute) {
            <view-keybinding [keybinding]="viewKeybinding" [isAuthenticated]="isAuthenticated"
                (keybindingUpdated)="updateKeybinding($event)" (refreshKeybindings)="refreshChildKeybindings()">
            </view-keybinding>
            }
        </mat-drawer-content>
    </mat-drawer-container>


</div>
