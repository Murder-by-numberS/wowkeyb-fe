<div class="flex flex-col w-full h-full">
    <!-- Toolbar -->
    <div class="sticky top-0 z-20 bg-white flex-shrink-0">
        <div class="flex flex-row p-2 bg-gray-300 items-center justify-between" #toolbarElem>
            <div class="flex flex-row">
                <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="reset()">
                    <mat-icon>restart_alt</mat-icon>
                    <span class="ml-2">Reset</span>
                </button>
                <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="zoomIn()">
                    <mat-icon>zoom_in</mat-icon>
                    <span class="ml-2">Zoom In</span>
                </button>
                <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="zoomOut()">
                    <mat-icon>zoom_out</mat-icon>
                    <span class="ml-2">Zoom Out</span>
                </button>
                <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panUp()">
                    <mat-icon>arrow_upward</mat-icon>
                    <span class="ml-2">Up</span>
                </button>
                <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panDown()">
                    <mat-icon>arrow_downward</mat-icon>
                    <span class="ml-2">Down</span>
                </button>
                <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panLeft()">
                    <mat-icon>arrow_back</mat-icon>
                    <span class="ml-2">Left</span>
                </button>
                <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panRight()">
                    <mat-icon>arrow_forward</mat-icon>
                    <span class="ml-2">Right</span>
                </button>
            </div>

            <!-- Mobile Controls -->
            <div class="sm:hidden flex flex-wrap gap-1 justify-start">
                <button mat-icon-button (click)="reset()" matTooltip="Reset View">
                    <mat-icon>refresh</mat-icon>
                </button>
                <button mat-icon-button (click)="zoomIn()" matTooltip="Zoom In">
                    <mat-icon>zoom_in</mat-icon>
                </button>
                <button mat-icon-button (click)="zoomOut()" matTooltip="Zoom Out">
                    <mat-icon>zoom_out</mat-icon>
                </button>
                <button mat-icon-button (click)="panUp()" matTooltip="Pan Up">
                    <mat-icon>keyboard_arrow_up</mat-icon>
                </button>
                <button mat-icon-button (click)="panDown()" matTooltip="Pan Down">
                    <mat-icon>keyboard_arrow_down</mat-icon>
                </button>
                <button mat-icon-button (click)="panLeft()" matTooltip="Pan Left">
                    <mat-icon>keyboard_arrow_left</mat-icon>
                </button>
                <button mat-icon-button (click)="panRight()" matTooltip="Pan Right">
                    <mat-icon>keyboard_arrow_right</mat-icon>
                </button>
            </div>
        </div>
    </div>
    <!-- Keyboard area -->
    <div class="flex-1 overflow-hidden min-h-[400px] relative">
        <!-- Loading indicator outside of PanZoom to avoid zoom interference -->
        @if (isInitializing) {
        <div class="flex items-center justify-center w-full h-full absolute inset-0 z-20 bg-gray-800">
            <div class="text-white text-xl font-medium">Loading keyboard...</div>
        </div>
        }

        <div class="w-full h-full bg-gray-800" #panZoom appPanZoom [zoomLevels]="10"
            [scalePerZoomLevel]="scalePerZoomLevel" [zoomStepDuration]="0.15" [freeMouseWheelFactor]="mouseWheelFactor"
            [zoomToFitZoomLevelFactor]="0.9" [neutralZoomLevel]="-6" [minZoomLevel]="-8" [zoomEnabled]="zoomEnabled">

            @if (!isInitializing) {
            <div class="flex items-center justify-center w-full h-full">
                <div class="relative p-5 bg-gray-800 rounded-lg shadow-lg min-w-[4800px]"
                    [ngStyle]="{'min-height.px': keyboardLayout.length * 250}" #keyboardContainer>
                    <div class="flex flex-col gap-12">
                        <div *ngFor="let row of keyboardLayout; let rowIdx = index" class="flex gap-12">
                            <div *ngFor="let key of row; let colIdx = index" cdkDropList
                                class="bg-gray-700 text-white font-semibold flex flex-col justify-start items-center min-h-[120px] w-[480px] rounded border border-gray-600 shadow-md transition-transform transform duration-300 ease-in-out hover:bg-gray-300 cursor-pointer"
                                [attr.data-key-id]="key.label + '-' + rowIdx + '-' + colIdx" #keyElem>
                                <div class="text-4xl font-bold my-4">{{ key.label }}</div>
                                <div class="flex flex-col w-full items-center gap-1">
                                    <ng-container *ngFor="let keybind of getSortedKeybinds(key.keybinds)">
                                        <div class="flex flex-row items-start w-full px-3 py-2 bg-gray-900 bg-opacity-80 rounded text-sm mb-2"
                                            style="max-width: 98%; min-height: 64px;">
                                            <img *ngIf="keybind.spell?.icon" [src]="keybind.spell.icon"
                                                [alt]="keybind.spell.name"
                                                class="w-8 h-8 rounded border border-gray-500 mr-3 mt-1">
                                            <div class="flex flex-col flex-1 min-w-0">
                                                <span class="font-bold text-base truncate">{{ keybind.spell?.name
                                                    }}</span>
                                                <span class="text-gray-300 text-xs break-words">{{
                                                    keybind.spell?.description }}</span>
                                                <span class="mt-2"><span class="text-gray-400 text-xs">Keybind:</span>
                                                    <span
                                                        class="font-mono font-bold bg-blue-800 bg-opacity-80 text-blue-200 px-2 py-1 rounded border border-blue-400 text-sm">{{
                                                        keybind.modifiers?.length ? keybind.modifiers.join('+') + '+' :
                                                        ''
                                                        }}{{ key.label }}</span></span>
                                            </div>
                                        </div>
                                    </ng-container>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</div>
