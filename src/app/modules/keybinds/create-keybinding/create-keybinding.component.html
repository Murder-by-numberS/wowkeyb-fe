<div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Create New Keybinding</h1>

    <form [formGroup]="keybindingForm" (ngSubmit)="onSubmit()"
        class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="mb-6">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Keybinding Name</label>
            <input type="text" id="name" formControlName="name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div class="mb-6">
            <label for="class" class="block text-sm font-medium text-gray-700 mb-2">Class</label>
            <select id="class" formControlName="class"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Select a class</option>
                <option *ngFor="let class of classes" [value]="class">{{class}}</option>
            </select>
        </div>

        <div class="mb-6">
            <label for="spec" class="block text-sm font-medium text-gray-700 mb-2">Specialization</label>
            <select id="spec" formControlName="spec"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Select a specialization</option>
                <option *ngFor="let spec of specs" [value]="spec">{{spec}}</option>
            </select>
        </div>

        <div class="mb-6">
            <label for="heroTalent" class="block text-sm font-medium text-gray-700 mb-2">Hero Talent</label>
            <select id="heroTalent" formControlName="heroTalent"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Select a hero talent</option>
                <option *ngFor="let talent of heroTalents" [value]="talent">{{talent}}</option>
            </select>
        </div>

        <div class="flex justify-end space-x-4">
            <button type="button" (click)="onCancel()"
                class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Cancel
            </button>
            <button type="submit" [disabled]="!keybindingForm.valid"
                class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
                Create Keybinding
            </button>
        </div>
    </form>
</div>
