<div class="flex flex-col w-full h-full">
    <div class="flex flex-row p-2 bg-gray-300">
        <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="reset()">
            <span class="ml-2">Reset</span>
        </button>
        <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="zoomIn()">
            <span class="ml-2">ZoomIn</span>
        </button>
        <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="zoomOut()">
            <span class="ml-2">ZoomOut</span>
        </button>
        <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panUp()">
            <span class="ml-2">Up</span>
        </button>
        <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panDown()">
            <span class="ml-2">Down</span>
        </button>
        <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panLeft()">
            <span class="ml-2">Left</span>
        </button>
        <button class="ml-3 hidden sm:inline-flex" mat-flat-button [color]="'primary'" (click)="panRight()">
            <span class="ml-2">Right</span>
        </button>
    </div>

    <div class="flex-1 overflow-hidden min-h-[500px]">
        <div #panZoom appPanZoom [zoomLevels]="10" [scalePerZoomLevel]="scalePerZoomLevel()" [zoomStepDuration]="0.2"
            [freeMouseWheelFactor]="0.01" [zoomToFitZoomLevelFactor]="0.9" [neutralZoomLevel]="neutralZoomLevel()"
            [zoomOnMouseWheel]="zoomEnabled()" (modelChange)="panzoomModel = $event" class="w-full h-full">
            <div class="relative p-5 bg-gray-800 rounded-lg shadow-lg min-w-[800px]">
                <div class="flex flex-col gap-1">
                    @for (row of keyboardLayout; track row) {
                    <div class="flex gap-1">
                        @for (key of row; track key) {
                        <div class="bg-gray-700 text-white font-semibold flex justify-center items-center h-12 {{ key.width }} rounded border border-gray-600 shadow-md transition-transform transform duration-300 ease-in-out hover:bg-gray-300 cursor-pointer"
                            [class.bg-green-500]="key.keybinds?.length" [class.bg-gray-700]="!key.keybinds?.length"
                            [class.cursor-default]="!key.keybinds?.length">
                            {{ key.label }}

                            @if (key.keybinds?.length) {
                            <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 flex justify-center">
                                @for (keybind of key.keybinds.slice(0, 3); track keybind) {
                                <div class="w-2 h-2 bg-white rounded-full mx-1"></div>
                                }
                                @if (key.keybinds.length > 3) {
                                <div class="text-white text-sm">+</div>
                                }
                            </div>
                            }
                        </div>
                        }
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
